[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "AI-assisted incident triage and support desk"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mehul Khanna" }]
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.17.0",
]

[tool.setuptools.packages.find]
include = ["opspilot*"]

[tool.setuptools.package-data]
opspilot = ["schema.sql", "templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
