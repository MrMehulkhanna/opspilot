services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: opspilot
      POSTGRES_DB: opspilot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://opspilot:opspilot@db:5432/opspilot
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      OPSPILOT_API_KEY: ${OPSPILOT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPSPILOT_SEED_DEMO: ${OPSPILOT_SEED_DEMO:-1}
    ports:
      - "8000:8000"

volumes:
  pgdata:
